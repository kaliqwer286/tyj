name: Build APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest  # 使用官方Buildozer容器
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: 设置环境变量
      run: |
        echo "ANDROIDSDK=/home/user/.android" >> $GITHUB_ENV
        echo "ANDROIDNDK=/home/user/.android" >> $GITHUB_ENV
        echo "ANDROIDAPI=30" >> $GITHUB_ENV
        echo "ANDROIDMINAPI=21" >> $GITHUB_ENV
    
    - name: 更新Buildozer
      run: |
        pip install --upgrade buildozer cython
    
    - name: 修复Buildozer兼容性问题
      run: |
        # 清理可能冲突的文件
        rm -rf ~/.buildozer
    
    - name: 构建APK
      run: |
        buildozer android debug
    
    - name: 列出生成的文件
      run: |
        ls -la bin/
        echo "APK文件列表："
        find bin -name "*.apk" -type f
    
    - name: 上传APK作为Artifact
      uses: actions/upload-artifact@v4
      with:
        name: atsc-wallet-apk
        path: bin/*.apk
        retention-days: 30
    
    - name: 创建Release并上传APK（当有tag时）
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: bin/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
