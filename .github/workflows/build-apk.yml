name: Build ATSC Wallet APK

# 触发条件：push到main分支或手动触发
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. 安装系统依赖
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3-pip python3-dev \
            openjdk-17-jdk \
            unzip wget \
            libssl-dev libffi-dev \
            build-essential \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libreadline-dev \
            libsqlite3-dev \
            libgdbm-dev \
            libdb5.3-dev \
            libbz2-dev \
            libexpat1-dev \
            liblzma-dev \
            tk-dev \
            libxml2-dev \
            libxmlsec1-dev
      
      # 3. 配置Android SDK环境
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-levels: 33
          build-tools: 33.0.2
          ndk-version: 25.2.9519653
          cmake-version: 3.22.1
          accept-android-sdk-licenses: true
      
      # 4. 安装Python依赖
      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt
      
      # 5. 初始化Buildozer（生成配置缓存）
      - name: Initialize Buildozer
        run: |
          buildozer android clean
          buildozer android debug --dry-run
      
      # 6. 构建APK
      - name: Build APK with Buildozer
        run: |
          export ANDROIDSDK_ROOT=${ANDROID_HOME}
          export ANDROIDNDK_ROOT=${ANDROID_NDK_HOME}
          export ANDROIDAPI=33
          export NDKAPI=21
          buildozer android debug
      
      # 7. 上传APK作为构建产物
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATSC-Wallet-APK
          path: ./bin/*.apk
      
      # 8. （可选）发布Release（当打Tag时自动发布）
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
