name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: 验证 buildozer.spec
      run: |
        # 检查是否有冲突的版本配置
        if grep -q "version\s*=" buildozer.spec && grep -q "version.regex" buildozer.spec; then
          echo "错误：同时定义了version和version.regex"
          echo "请只保留其中一个"
          exit 1
        fi
        echo "配置文件验证通过"
    
    - name: 设置环境变量
      run: |
        echo "ANDROIDSDK=/home/user/.android" >> $GITHUB_ENV
        echo "ANDROIDNDK=/home/user/.android" >> $GITHUB_ENV
        echo "ANDROIDAPI=30" >> $GITHUB_ENV
        echo "ANDROIDMINAPI=21" >> $GITHUB_ENV
    
    - name: 更新Buildozer
      run: |
        pip install --upgrade buildozer cython
    
    - name: 构建APK
      run: |
        buildozer android debug
    
    - name: 上传APK
      uses: actions/upload-artifact@v4
      with:
        name: atsc-wallet-apk
        path: bin/*.apk
        retention-days: 30
