name: Build ATSC Wallet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3-pip python3-dev \
            unzip wget git \
            libssl-dev libffi-dev \
            build-essential \
            zlib1g-dev libncurses5-dev libreadline-dev libsqlite3-dev libbz2-dev liblzma-dev tk-dev

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: >
            platform-tools
            platforms;android-33
            build-tools;33.0.2
            ndk;25.2.9519653

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install --user buildozer Cython kivy==2.1.0 requests websocket-client Pillow
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # 🔥 关键：强制让 buildozer 使用用户目录，不碰系统目录
      - name: Build APK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME
          cp -r $ANDROID_SDK_ROOT/* $ANDROID_HOME/
          chmod -R 777 $ANDROID_HOME

          buildozer android debug deploy
        env:
          PATH: "$HOME/.local/bin:$PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk
