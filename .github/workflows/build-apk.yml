name: Build ATSC Wallet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 安装 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. 安装系统依赖（包含所有必要命令）
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3-pip python3-dev \
            unzip wget git \
            libssl-dev libffi-dev \
            build-essential \
            zlib1g-dev libncurses5-dev libreadline-dev libsqlite3-dev libbz2-dev liblzma-dev tk-dev

      # 3. 安装 Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: >
            platform-tools
            platforms;android-33
            build-tools;33.0.2
            ndk;25.2.9519653

      # 4. 安装 Python 依赖
      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install --user buildozer Cython kivy==2.1.0 requests websocket-client Pillow
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # 5. 构建 APK（关键修复：用单条 run 命令，确保环境变量生效）
      - name: Build APK with Buildozer
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME
          cp -r $ANDROID_SDK_ROOT/* $ANDROID_HOME/
          chmod -R 777 $ANDROID_HOME
          buildozer android debug deploy run

      # 6. 上传 APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATSC-Wallet-APK
          path: ./bin/*.apk
