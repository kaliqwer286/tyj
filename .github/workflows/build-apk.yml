name: Build ATSC Wallet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 先安装 JDK 17，解决版本问题
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 安装系统依赖
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3-pip python3-dev \
            unzip wget \
            libssl-dev libffi-dev \
            build-essential \
            zlib1g-dev libncurses5-dev libreadline-dev libsqlite3-dev libbz2-dev liblzma-dev tk-dev

      # 正确配置 Android SDK（v3 语法）
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: >
            platform-tools
            platforms;android-33
            build-tools;33.0.2
            ndk;25.2.9519653

      # 安装 Python 依赖
      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt

      # 构建 APK
      - name: Build APK with Buildozer
        run: |
          export ANDROID_HOME=${{ env.ANDROID_HOME }}
          export ANDROIDSDK_ROOT=${ANDROID_HOME}
          export ANDROIDNDK_ROOT=${ANDROID_HOME}/ndk/25.2.9519653
          export ANDROIDAPI=33
          export NDKAPI=21
          buildozer android debug

      # 上传 APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATSC-Wallet-APK
          path: ./bin/*.apk
